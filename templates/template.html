<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{title}} - 灏天阁</title>
    <meta name="description" content="{{title}} - 灏天阁技术博客文章">
    <link href="https://fonts.cdnfonts.com/css/sf-mono" rel="stylesheet">
    <link rel="shortcut icon" href="/images/code.svg" type="image/x-icon">
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/prism.css" />
  </head>
  <body class="article-page">
    <!-- 返回首页按钮 -->
    <a href="/" class="home-button" title="返回首页">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9,22 9,12 15,12 15,22"/>
      </svg>
    </a>
    
    <div class="article-container">
      <main class="article-main" role="main">
        <header>
          <h1>{{title}}</h1>
          <p class="article-meta">
            <span class="category">{{category}}</span>
            <span class="separator">|</span>
            <time datetime="{{date}}">{{date}}</time>
          </p>
        </header>
        <article>
          {{{content}}}
        </article>
      </main>
      
      <aside class="toc-container" role="complementary">
        <h3>目录</h3>
        <nav class="toc" aria-label="文章目录"></nav>
      </aside>
    </div>

    <!-- 回到顶部按钮 -->
    <button class="to-top home-button" title="回到顶部" aria-label="回到顶部">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="19" x2="12" y2="5"/>
        <polyline points="5,12 12,5 19,12"/>
      </svg>
    </button>
    
    <script src="/js/prism.js"></script>
    <script src="/js/script.js"></script>
    <script src="/js/background.js"></script>
  </body>
</html>
