<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>灏天阁</title>
    <link rel="shortcut icon" href="/images/code.svg" type="image/x-icon" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="home-page">
    <div class="home-main">
      <!-- 左侧边栏 -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <h3>文章分类</h3>
          <a href="/navigation.html" target="_blank" class="nav-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9,22 9,12 15,12 15,22"></polyline>
            </svg>
            网站导航
          </a>
        </div>
        <!-- 搜索功能 -->
        <div class="search-container">
          <input type="text" id="search-input" placeholder="搜索文章..." />
          <button id="search-button">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </button>
        </div>
        <div id="category-list">{{{categoryFilter}}}</div>
      </aside>

      <!-- 主内容区域 -->
      <main>
        <ul class="home-articles-list">
          {{{articleList}}}
        </ul>
      </main>
    </div>
    <script src="/js/script.js"></script>
    <script src="/js/background.js"></script>
    <script>
      // 搜索功能
      document.addEventListener('DOMContentLoaded', function() {
        const searchInput = document.getElementById('search-input');
        const searchButton = document.getElementById('search-button');
        const articleItems = document.querySelectorAll('.home-articles-list li');
        
        // 搜索函数
        function performSearch() {
          const searchTerm = searchInput.value.toLowerCase().trim();
          
          if (searchTerm === '') {
            // 如果搜索词为空，显示所有文章
            articleItems.forEach(item => {
              item.style.display = '';
            });
            return;
          }
          
          // 过滤文章
          articleItems.forEach(item => {
            const articleTitle = item.querySelector('a').textContent.toLowerCase();
            if (articleTitle.includes(searchTerm)) {
              item.style.display = '';
            } else {
              item.style.display = 'none';
            }
          });
        }
        
        // 点击搜索按钮时执行搜索
        searchButton.addEventListener('click', performSearch);
        
        // 按下回车键时执行搜索
        searchInput.addEventListener('keypress', function(e) {
          if (e.key === 'Enter') {
            performSearch();
          }
        });
        
        // 输入时实时搜索（可选）
        searchInput.addEventListener('input', performSearch);
      });
    </script>
  </body>
</html>
