<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>灏天阁 - 技术博客</title>
    <meta name="description" content="灏天阁技术博客，分享前端开发、编程技术和学习心得">
    <link href="https://fonts.cdnfonts.com/css/sf-mono" rel="stylesheet">
    <link rel="shortcut icon" href="/images/code.svg" type="image/x-icon" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="home-page">
    <!-- 返回首页按钮 -->
    <a href="/" class="home-button" title="返回首页">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9,22 9,12 15,12 15,22"/>
      </svg>
    </a>

    <div class="home-main">
      <!-- 左侧边栏 -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <h3>文章分类</h3>
        </div>
        
        <!-- 搜索功能 -->
        <div class="search-container">
          <input type="text" id="search-input" placeholder="搜索文章..." aria-label="搜索文章" />
          <button id="search-button" title="搜索" aria-label="搜索按钮">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </button>
        </div>
        
        <div id="category-list" role="navigation" aria-label="文章分类">{{{categoryFilter}}}</div>
      </aside>

      <!-- 主内容区域 -->
      <main role="main">
        <header style="display: none;">
          <h1>灏天阁</h1>
          <p>知识如山水长流，观之可悟！</p>
        </header>
        
        <ul class="home-articles-list" role="list">
          {{{articleList}}}
        </ul>
      </main>
    </div>
    
    <!-- 回到顶部按钮 -->
    <!-- 回到顶部按钮 -->
    <button class="to-top home-button" title="回到顶部" aria-label="回到顶部">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="19" x2="12" y2="5"/>
        <polyline points="5,12 12,5 19,12"/>
      </svg>
    </button>

    <!-- 高级浮窗 -->
    <div class="floating-widget" id="floatingWidget">
      <div class="widget-toggle" id="widgetToggle" title="更多功能">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 1v6m0 6v6m11-7h-6m-6 0H1"/>
        </svg>
      </div>
      
      <div class="widget-menu" id="widgetMenu">
        <a href="/ssq.html" class="widget-item" title="双色球查询">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <circle cx="12" cy="12" r="6"/>
            <circle cx="12" cy="12" r="2"/>
          </svg>
          双色球查询
        </a>
        
        <a href="/dlt.html" class="widget-item" title="大乐透查询">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
          </svg>
          大乐透查询
        </a>
        
        <a href="/navigation.html" class="widget-item" title="网站导航">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9,22 9,12 15,12 15,22"/>
          </svg>
          网站导航
        </a>

        <a href="/repository-list.html" class="widget-item" title="仓库列表">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/>
          </svg>
          仓库列表
        </a>
        
        <a href="#" class="widget-item special" title="更多工具" onclick="alert('更多功能即将上线！'); return false;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
          </svg>
          更多工具
        </a>
      </div>
    </div>
    
    <script src="/js/script.js"></script>
    <script src="/js/background.js"></script>
    <script>
      // 搜索功能
      document.addEventListener('DOMContentLoaded', function() {
        const searchInput = document.getElementById('search-input');
        const searchButton = document.getElementById('search-button');
        const articleItems = document.querySelectorAll('.home-articles-list li');
        
        // 搜索函数
        function performSearch() {
          const searchTerm = searchInput.value.toLowerCase().trim();
          
          if (searchTerm === '') {
            // 如果搜索词为空，显示所有文章
            articleItems.forEach(item => {
              item.style.display = '';
            });
            return;
          }
          
          // 过滤文章
          articleItems.forEach(item => {
            const articleTitle = item.querySelector('a').textContent.toLowerCase();
            if (articleTitle.includes(searchTerm)) {
              item.style.display = '';
            } else {
              item.style.display = 'none';
            }
          });
        }
        
        // 点击搜索按钮时执行搜索
        searchButton.addEventListener('click', performSearch);
        
        // 按下回车键时执行搜索
        searchInput.addEventListener('keypress', function(e) {
          if (e.key === 'Enter') {
            performSearch();
          }
        });
        
        // 输入时实时搜索（可选）
        // 输入时实时搜索（可选）
        searchInput.addEventListener('input', performSearch);
      });

      // 浮窗功能
      const floatingWidget = document.getElementById('floatingWidget');
      const widgetToggle = document.getElementById('widgetToggle');
      
      widgetToggle.addEventListener('click', function() {
        floatingWidget.classList.toggle('active');
      });
      
      // 点击外部关闭浮窗
      document.addEventListener('click', function(e) {
        if (!floatingWidget.contains(e.target)) {
          floatingWidget.classList.remove('active');
        }
      });
      
      // 阻止浮窗内部点击事件冒泡
      floatingWidget.addEventListener('click', function(e) {
        e.stopPropagation();
      });
    </script>
  </body>
</html>
