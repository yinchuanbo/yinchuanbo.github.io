<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>仓库列表 - 灏天阁</title>
    <meta name="description" content="灏天阁技术博客仓库列表，展示开源项目" />
    <link href="https://fonts.cdnfonts.com/css/sf-mono" rel="stylesheet" />
    <link rel="shortcut icon" href="/images/code.svg" type="image/x-icon" />
    <link rel="stylesheet" href="/css/style.css" />
    <style>
      .repository-container {
        display: flex;
        margin: 32px auto;
        gap: 32px;
        padding: 0 24px;
        align-items: flex-start;
        justify-content: center;
      }

      .repository-main {
        width: var(--main-width);
        position: relative;
        z-index: 1;
        padding: 64px 72px;
        border-radius: 32px;
        box-shadow: var(--shadow-premium);
        backdrop-filter: blur(40px);
        border: 1px solid var(--glass-border);
        transition: all 0.6s var(--ease-out-quart);
        background: var(--glass-bg);
      }

      .repository-main::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(
          135deg,
          rgba(102, 126, 234, 0.05) 0%,
          rgba(118, 75, 162, 0.01) 100%
        );
        border-radius: 32px;
        pointer-events: none;
        z-index: -1;
      }

      .repository-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
        gap: 24px;
        margin-top: 40px;
      }

      .repository-card {
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: 20px;
        padding: 28px;
        transition: all 0.6s var(--ease-out-quart);
        box-shadow: var(--shadow-md);
        backdrop-filter: blur(20px);
        position: relative;
        overflow: hidden;
      }

      .repository-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(
          135deg,
          rgba(102, 126, 234, 0.03) 0%,
          rgba(118, 75, 162, 0.01) 100%
        );
        border-radius: 20px;
        opacity: 0;
        transition: opacity 0.6s var(--ease-out-quart);
        pointer-events: none;
      }

      .repository-card:hover {
        transform: translateY(-8px);
        box-shadow: var(--shadow-premium), var(--glow-subtle);
        border-color: var(--accent-primary);
      }

      .repository-card:hover::before {
        opacity: 1;
      }

      .repository-title {
        font-size: 1.25rem;
        font-weight: 600;
        color: var(--accent-primary);
        text-decoration: none;
        margin-bottom: 16px;
        display: block;
        transition: all 0.3s var(--ease-out-quart);
        position: relative;
        z-index: 1;
      }

      .repository-title:hover {
        color: var(--accent-secondary);
        transform: translateX(4px);
      }

      .repository-description {
        color: var(--text-secondary);
        font-size: 0.95rem;
        line-height: 1.6;
        margin-bottom: 20px;
        position: relative;
        z-index: 1;
      }

      .repository-meta {
        display: flex;
        align-items: center;
        gap: 20px;
        font-size: 0.875rem;
        color: var(--text-tertiary);
        position: relative;
        z-index: 1;
        display: none;
      }

      .repository-language {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 500;
      }

      .language-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        box-shadow: var(--shadow-sm);
      }

      .search-container {
        margin-bottom: 32px;
        position: relative;
        display: flex;
        align-items: center;
        max-width: 400px;
        margin-left: auto;
        margin-right: auto;
      }

      .search-input {
        width: 100%;
        padding: 16px 48px 16px 20px;
        border-radius: 16px;
        border: 1px solid var(--glass-border);
        background: var(--glass-bg);
        font-family: var(--ff);
        font-size: 0.95rem;
        color: var(--text-primary);
        transition: all 0.3s var(--ease-out-quart);
        box-shadow: var(--shadow-sm);
        backdrop-filter: blur(20px);
      }

      .search-input:focus {
        outline: none;
        border-color: var(--accent-primary);
        background: var(--glass-hover);
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2), var(--glow-subtle);
      }

      .search-input::placeholder {
        color: var(--text-muted);
      }

      .search-button {
        position: absolute;
        right: 16px;
        background: none;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        padding: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
      }

      .search-button:hover {
        color: var(--accent-primary);
        transform: scale(1.1);
      }

      .stats-item {
        display: flex;
        align-items: center;
        gap: 4px;
        font-weight: 500;
      }
    </style>
  </head>
  <body class="repository-page">
    <!-- 返回首页按钮 -->
    <a href="/" class="home-button" title="返回首页">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
        <polyline points="9,22 9,12 15,12 15,22" />
      </svg>
    </a>

    <div class="repository-container">
      <main class="repository-main">
        <header>
          <h1>仓库列表</h1>
          <p>探索我的开源项目，发现有趣的代码</p>
        </header>

        <div class="search-container">
          <input
            type="text"
            class="search-input"
            placeholder="搜索仓库..."
            id="searchInput"
          />
          <button class="search-button" id="searchButton">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </button>
        </div>

        <div class="repository-grid" id="repositoryGrid">
          <div
            class="repository-card"
            data-name="next-learn"
            data-language="javascript"
          >
            <a
              href="https://gitee.com/haochenyin/next-learn"
              target="_blank"
              class="repository-title"
            >
              Next.js 官方学习教程
            </a>
            <p class="repository-description">
              Vercel 官方提供的 Next.js
              学习教程和示例代码，包含完整的学习路径和实战项目，是学习 Next.js
              的最佳资源。
            </p>
            <div class="repository-meta">
              <div class="repository-language">
                <span
                  class="language-dot"
                  style="background-color: #f7df1e"
                ></span>
                JavaScript
              </div>
              <div class="stats-item">⭐ 3.2k</div>
              <div class="stats-item">🍴 1.8k</div>
            </div>
          </div>
          <div
            class="repository-card"
            data-name="typescript-nextjs-starter"
            data-language="typescript"
          >
            <a
              href="https://gitee.com/haochenyin/typescript-nextjs-starter"
              target="_blank"
              class="repository-title"
            >
              TypeScript Next.js 项目脚手架
            </a>
            <p class="repository-description">
              基于 TypeScript 和 Next.js
              的现代化项目启动模板，集成了最佳实践配置、代码规范和开发工具链。
            </p>
            <div class="repository-meta">
              <div class="repository-language">
                <span
                  class="language-dot"
                  style="background-color: #3178c6"
                ></span>
                TypeScript
              </div>
              <div class="stats-item">⭐ 28</div>
              <div class="stats-item">🍴 6</div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- 回到顶部按钮 -->
    <button class="to-top home-button" title="回到顶部" aria-label="回到顶部">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <line x1="12" y1="19" x2="12" y2="5" />
        <polyline points="5,12 12,5 19,12" />
      </svg>
    </button>

    <script src="/js/script.js"></script>
    <script src="/js/background.js"></script>
    <script>
      // 搜索功能
      const searchInput = document.getElementById("searchInput");
      const searchButton = document.getElementById("searchButton");
      const repositoryGrid = document.getElementById("repositoryGrid");
      const repositoryCards = document.querySelectorAll(".repository-card");

      // 搜索函数
      function performSearch() {
        const searchTerm = searchInput.value.toLowerCase().trim();

        repositoryCards.forEach((card) => {
          const name = card.dataset.name.toLowerCase();
          const language = card.dataset.language.toLowerCase();
          const title = card
            .querySelector(".repository-title")
            .textContent.toLowerCase();
          const description = card
            .querySelector(".repository-description")
            .textContent.toLowerCase();

          const isMatch =
            searchTerm === "" ||
            name.includes(searchTerm) ||
            language.includes(searchTerm) ||
            title.includes(searchTerm) ||
            description.includes(searchTerm);

          card.style.display = isMatch ? "block" : "none";
        });
      }

      // 点击搜索按钮时执行搜索
      searchButton.addEventListener("click", performSearch);

      // 按下回车键时执行搜索
      searchInput.addEventListener("keypress", function (e) {
        if (e.key === "Enter") {
          performSearch();
        }
      });

      // 输入时实时搜索
      searchInput.addEventListener("input", performSearch);

      // 点击跟踪
      document.querySelectorAll(".repository-title").forEach((link) => {
        link.addEventListener("click", function () {
          console.log("Repository clicked:", this.textContent.trim());
        });
      });
    </script>
  </body>
</html>
