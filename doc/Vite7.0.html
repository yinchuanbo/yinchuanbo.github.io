<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite7.0 - 专题页面</title>
    <meta name="description" content="Vite7.0 专题内容，深入探索技术知识">
    <link rel="shortcut icon" href="/images/code.svg" type="image/x-icon">
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/special.css" />
    <link rel="stylesheet" href="/css/prism.css" />
</head>
<body class="special-page">
    <!-- 返回首页按钮 -->
    <a href="/" class="home-button" title="返回首页">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9,22 9,12 15,12 15,22"/>
        </svg>
    </a>
    
    <!-- 主要内容区域 -->
    <div class="special-container">
        <!-- 专题导航侧边栏 -->
        <aside class="special-list">
            <h3>Vite7.0</h3>
            <ul></ul>
        </aside>
        
        <!-- 专题内容主体 -->
        <main id="special-content" role="main">
            <div class="content-placeholder">
                <div class="placeholder-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14,2 14,8 20,8"/>
                        <line x1="16" y1="13" x2="8" y2="13"/>
                        <line x1="16" y1="17" x2="8" y2="17"/>
                        <polyline points="10,9 9,9 8,9"/>
                    </svg>
                </div>
                <h2>选择左侧专题查看内容</h2>
                <p>点击侧边栏中的任意专题链接开始阅读</p>
            </div>
        </main>
    </div>
    
    <!-- 回到顶部按钮 -->
    <button class="to-top" title="回到顶部">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"/>
            <polyline points="5,12 12,5 19,12"/>
        </svg>
    </button>
    
    <!-- 脚本文件 -->
    <script src="/js/prism.js"></script>
    <script src="/js/script.js"></script>
    <script src="/js/background.js"></script>
</body>
</html>
