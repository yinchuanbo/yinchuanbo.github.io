<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>超级大乐透 | 中国彩票查询系统</title>
    <link rel="stylesheet" href="css/dlt.css" />
    <link rel="shortcut icon" href="/images/code.svg" type="image/x-icon">
  </head>
  <body class="dark-theme">
    <div class="page-container">
      <header>
        <h1 class="title">超级大乐透查询系统</h1>
        <p class="subtitle">快速查询您的彩票号码是否中奖</p>
      </header>

      <div class="info-banner">
        <div class="info-icon">
          <i class="fas fa-info-circle"></i>
        </div>
        <div class="info-content">
          <p>
            本页面显示您的投注号码，点击"查看开奖结果"按钮可匹配最新开奖结果。
          </p>
        </div>
      </div>

      <div class="codes-container">
        <div class="codes" id="codes"></div>
      </div>

      <footer>
        <button id="check" class="check-button">
          <span class="shadow"></span>
          <span class="edge"></span>
          <span class="front text"
            ><i class="fas fa-search"></i> 查看开奖结果</span
          >
        </button>
        <div class="footer-info">
          <p>
            © 2023 中国彩票查询系统 - 数据更新时间:
            <span id="update-time">加载中...</span>
          </p>
        </div>
      </footer>
    </div>

    <div class="background-animation">
      <div class="circle-container">
        <div class="circle"></div>
      </div>
      <div class="circle-container">
        <div class="circle"></div>
      </div>
      <div class="circle-container">
        <div class="circle"></div>
      </div>
    </div>

    <script src="js/dlt.js"></script>
  </body>
</html>
